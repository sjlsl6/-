# Temporary PR trigger for a generic dependency cache export only.
name: Export Generic Android Gradle Cache

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-generic-android-gradle-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Gradle 8.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install generic Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create dependency-only sample project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dummy/app/src/main/java/example/toolchain dummy/app/src/androidTest/java/example/toolchain
          cat > dummy/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GenericAndroidCacheWarmup'
          include ':app'
          EOF
          cat > dummy/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > dummy/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'example.toolchain'
              compileSdk 35
              defaultConfig {
                  applicationId 'example.toolchain'
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }
          }
          dependencies {
              androidTestImplementation 'androidx.test:runner:1.6.1'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'androidx.test:core:1.6.1'
              androidTestImplementation 'junit:junit:4.13.2'
          }
          EOF
          cat > dummy/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          mkdir -p dummy/app/src/main/res/values
          cat > dummy/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > dummy/app/src/main/java/example/toolchain/MainActivity.java <<'EOF'
          package example.toolchain;
          public final class MainActivity extends android.app.Activity {}
          EOF
          cat > dummy/app/src/androidTest/java/example/toolchain/SmokeTest.java <<'EOF'
          package example.toolchain;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          @RunWith(AndroidJUnit4.class) public final class SmokeTest { @Test public void loads() {} }
          EOF

      - name: Warm AGP and AndroidX dependency cache
        working-directory: dummy
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace

      - name: Package portable Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-out
          rm -rf "$HOME/.gradle/caches/build-cache-*" "$HOME/.gradle/caches/*/fileChanges" || true
          tar -C "$HOME/.gradle" -czf cache-out/gradle-cache-agp873-androidx.tar.gz caches
          printf '%s\n' \
            'Generic Gradle dependency cache warmed from a blank Android project.' \
            'Contains AGP 8.7.3 and AndroidX test dependencies only; no SPS-PD files are included.' \
            > cache-out/README.txt
          (cd cache-out && sha256sum gradle-cache-agp873-androidx.tar.gz > SHA256SUMS.txt)
          ls -lh cache-out

      - name: Upload generic Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: generic-gradle-cache-agp873-androidx
          path: cache-out/*
          if-no-files-found: error
          retention-days: 1
