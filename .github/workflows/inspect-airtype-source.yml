name: Inspect AirType source

on:
  push:
    branches:
      - feature/session-character-counter
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpack:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand AirType source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          Expand-Archive -LiteralPath "src/airtype-v2.3.0-source.zip" -DestinationPath extracted -Force
          Get-ChildItem -Path extracted -Recurse | Select-Object FullName, Length

      - name: Upload expanded source
        uses: actions/upload-artifact@v4
        with:
          name: airtype-v2.3.0-expanded-source
          path: extracted
          if-no-files-found: error
          retention-days: 7
