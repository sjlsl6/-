name: Export Generic Android Toolchain

on:
  push:
    branches:
      - toolchain/spspd-android-build
    paths:
      - '.github/workflows/export-generic-android-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download generic Gradle and Android packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl -fL --retry 4 --retry-delay 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o toolchain/gradle-8.9-bin.zip
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Package portable toolchain archives
        shell: bash
        run: |
          set -euo pipefail
          JDK_PARENT="$(dirname "$JAVA_HOME")"
          JDK_NAME="$(basename "$JAVA_HOME")"
          tar -C "$JDK_PARENT" -czf toolchain/jdk17-linux-x64.tar.gz "$JDK_NAME"
          tar -C "$ANDROID_HOME" -czf toolchain/android-sdk-api35-linux-x64.tar.gz \
            build-tools/35.0.0 \
            platforms/android-35 \
            platform-tools \
            cmdline-tools/latest \
            licenses
          printf '%s\n' \
            'Generic toolchain only: JDK 17, Gradle 8.9, Android platform/build-tools 35.' \
            'No SPS-PD source code, patches, APK, signing key, credentials, or save data are included.' \
            > toolchain/README.txt
          (cd toolchain && sha256sum gradle-8.9-bin.zip jdk17-linux-x64.tar.gz android-sdk-api35-linux-x64.tar.gz > SHA256SUMS.txt)
          ls -lh toolchain

      - name: Upload generic toolchain
        uses: actions/upload-artifact@v4
        with:
          name: generic-android-toolchain-jdk17-gradle89-api35
          path: toolchain/*
          if-no-files-found: error
          retention-days: 1
