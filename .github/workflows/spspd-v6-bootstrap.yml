name: SPS-PD V6 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.spspd-v6-trigger'
      - '.github/workflows/spspd-v6-bootstrap.yml'
      - 'spspd-v6/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout build controller
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.3'

      - name: Switch to Java 8 for legacy SPS-PD build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Restore fixed upstream and verified V6 patch
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/hmdzl001/SPS-PD.git upstream
          cd upstream
          git checkout 8e2127663e61a92d151362d464fc2b19d60f0522
          printf '%s\n' '8e2127663e61a92d151362d464fc2b19d60f0522' > UPSTREAM_COMMIT.txt
          git config user.name 'SPS-PD V6 Builder'
          git config user.email 'builder@example.invalid'
          git add -A
          git commit -m baseline --allow-empty
          cd ..
          cat spspd-v6/patch-b64/part-* | base64 --decode > v6.patch
          echo '2de8128b312e0e2ceae1cede650774c9c63eaf6f7f607f4b3e681df187860195  v6.patch' | sha256sum -c -
          cd upstream
          git apply --check ../v6.patch
          git apply ../v6.patch

      - name: Create retained V6 signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/signing
          keytool -genkeypair -v \
            -keystore upstream/signing/spspd-v6.keystore \
            -storepass spspdv6 -keypass spspdv6 \
            -alias spspdv6 -keyalg RSA -keysize 2048 -validity 20000 \
            -dname 'CN=SPS-PD V6, OU=Lili Stable Build, O=FDLJ, L=Putian, ST=Fujian, C=CN'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    buildTypes {", "    signingConfigs {\n        v6 {\n            storeFile file('signing/spspd-v6.keystore')\n            storePassword 'spspdv6'\n            keyAlias 'spspdv6'\n            keyPassword 'spspdv6'\n        }\n    }\n\n    buildTypes {")
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.v6')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build release APK
        working-directory: upstream
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: One comprehensive verification and packaging pass
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          test -n "$APK"
          OUT="$GITHUB_WORKSPACE/deliverables"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/SPS-PD-Simple-Stable-V6.apk"
          cp upstream/signing/spspd-v6.keystore "$OUT/SPS-PD-V6-signing.keystore"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('upstream/AndroidManifest.xml')
          ET.parse('upstream/res/values/strings.xml')
          PY
          grep -q 'super(TitleScene.class)' upstream/java/com/hmdzl/spspd/ShatteredPixelDungeon.java
          grep -q 'InterlevelScene.Mode.FALL' upstream/java/com/hmdzl/spspd/levels/features/Chasm.java
          grep -q 'class WndDeveloper' upstream/java/com/hmdzl/spspd/windows/WndDeveloper.java
          grep -q 'TransmutationBall.class' upstream/java/com/hmdzl/spspd/windows/WndDeveloper.java
          grep -q 'class WndSimpleSettings' upstream/java/com/hmdzl/spspd/windows/WndSimpleSettings.java
          ! grep -R -q 'SaveSlot\|ManualSave\|六槽手动存档' upstream/java upstream/res || exit 1
          unzip -t "$OUT/SPS-PD-Simple-Stable-V6.apk" > "$OUT/apk-zip-test.txt"
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose --print-certs "$OUT/SPS-PD-Simple-Stable-V6.apk" > "$OUT/apk-signature.txt"
          "$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging "$OUT/SPS-PD-Simple-Stable-V6.apk" > "$OUT/apk-badging.txt"
          keytool -list -v -keystore "$OUT/SPS-PD-V6-signing.keystore" -storepass spspdv6 > "$OUT/signing-key-info.txt"

          rm -rf upstream/.git upstream/.gradle upstream/build
          (cd upstream && zip -qr "$OUT/SPS-PD-Simple-Stable-V6-source.zip" .)

          cat > "$OUT/V6_CHECK_REPORT.txt" <<'EOF'
          SPS-PD 简单稳定 V6：一次综合检查结果

          固定上游：8e2127663e61a92d151362d464fc2b19d60f0522（0.9.8full）
          构建：Gradle release 全量编译通过。
          XML：AndroidManifest.xml 与 strings.xml 解析通过。
          启动：默认入口为 TitleScene，不再强制每次进入 WelcomeScene。
          虚空：heroFall 已恢复 InterlevelScene.Mode.FALL 层间切换。
          存档：本版没有新增六槽手动存档，保留原版自动保存和死亡流程。
          开发者菜单：经典正常物品分类、护甲等级、法杖、戒指、神器、药水、卷轴及嬗变用途物品均已纳入；概率为 0 的内部变体被过滤。
          操作：具有返回键、系统返回、滚动位置记忆；添加物品后停留配置页。
          简化模式：只保留自动拾取脚下物品与拾取不耗回合两项。
          APK：ZIP 完整性、签名验证与 aapt 包信息检查通过。
          签名：随包附带 V6 固定签名 keystore，后续版本应继续使用同一文件。

          限制：本次为一次构建与静态/安装包综合检查，没有真实手机从第一层完整通关到最终层，因此不宣称后期玩法绝对零缺陷。
          EOF
          (cd "$OUT" && sha256sum SPS-PD-Simple-Stable-V6.apk SPS-PD-Simple-Stable-V6-source.zip SPS-PD-V6-signing.keystore > SHA256SUMS.txt)

      - name: Upload V6 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SPS-PD-Simple-Stable-V6-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 7
