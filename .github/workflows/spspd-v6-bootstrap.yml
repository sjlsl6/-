name: SPS-PD V6 Patch Debug

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/spspd-v6-bootstrap.yml'
      - 'spspd-v6/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble transported patch
        shell: bash
        run: |
          set -euo pipefail
          cat spspd-v6/patch-b64/part-* > assembled.b64
          base64 --decode assembled.b64 > v6.patch
          sha256sum assembled.b64 v6.patch > transported-checksums.txt
          cat transported-checksums.txt
      - name: Upload transported patch and source chunks
        uses: actions/upload-artifact@v4
        with:
          name: spspd-v6-transport-chunks
          path: |
            spspd-v6/patch-b64/
            assembled.b64
            v6.patch
            transported-checksums.txt
          if-no-files-found: error
          retention-days: 1
