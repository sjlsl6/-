name: Export Generic Android Gradle Cache

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.toolchain-cache-trigger'
      - '.github/workflows/export-generic-gradle-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android APIs and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - name: Create generic dependency-only Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generic/app/src/main generic/app/src/androidTest/java/example
          cat > generic/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GenericAndroidDependencyCache'
          include ':app'
          EOF
          cat > generic/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > generic/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'example.cache'
            compileSdk 35
            defaultConfig {
              applicationId 'example.cache'
              minSdk 21
              targetSdk 35
              versionCode 1
              versionName '1.0'
              testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            }
          }
          dependencies {
            androidTestImplementation 'androidx.test:runner:1.6.1'
            androidTestImplementation 'androidx.test.ext:junit:1.2.1'
            androidTestImplementation 'androidx.test:core:1.6.1'
          }
          EOF
          cat > generic/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" /></manifest>
          EOF
          cat > generic/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
      - name: Resolve AGP and AndroidX dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build generic app and test APK
        working-directory: generic
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Package portable JDK, SDK component, and Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JDK_PARENT="$(dirname "$JAVA_HOME")"
          JDK_NAME="$(basename "$JAVA_HOME")"
          tar -chzf out/jdk17-linux-x64-portable.tar.gz -C "$JDK_PARENT" "$JDK_NAME"
          tar -czf out/gradle-8.9-android-dependency-cache.tar.gz -C "$HOME/.gradle/caches" modules-2
          tar -czf out/android-build-tools-34.0.0-linux-x64.tar.gz -C "$ANDROID_HOME" build-tools/34.0.0
          printf '%s\n' \
            'Generic cache only: AGP 8.7.3, AndroidX test dependencies, JDK 17, and Android Build Tools 34.0.0.' \
            'No SPS-PD source, patches, APK, signing material, credentials, or save data.' \
            > out/README.txt
          (cd out && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -lh out
      - name: Upload generic cache
        uses: actions/upload-artifact@v4
        with:
          name: generic-agp873-androidx-cache-jdk17-bt34
          path: out/*
          if-no-files-found: error
          retention-days: 1
