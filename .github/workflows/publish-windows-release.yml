name: Publish verified Windows release

on:
  workflow_dispatch:
  issues:
    types:
      - opened
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-windows-release.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v2026.07.24
  RELEASE_TITLE: QAA AirType + ADB Toolkit v2026.07.24

jobs:
  publish:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'Publish Windows release v2026.07.24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
          check-latest: false

      - name: Extract the three public source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src dist
          unzip -q src/airtype-v2.3.0-source.zip -d work/src
          unzip -q src/adb-tap-wireless-v1.1.0-source.zip -d work/src
          unzip -q src/adb-tap-direct-v1.2.0-source.zip -d work/src
          find work/src -maxdepth 2 -type f | sort

      - name: Run all source tests
        shell: bash
        run: |
          set -euo pipefail
          (cd work/src/airtype-v2.3.0 && go test ./...)
          (cd work/src/adb-tap-wireless-v1.1.0 && go test ./...)
          (cd work/src/adb-tap-direct-v1.2.0 && go test ./...)

      - name: Rebuild the exact tested Windows executables
        shell: bash
        run: |
          set -euo pipefail

          AIRTYPE_BUILD_ID='N1kGQiO1P6MzOKbcXgXd/skKJPixqLtyG3qtgIffH/_rsAK9qPrzbXJoXR7YLR/TWbXoBLMtW9ip9oHsDoQ'

          (
            cd work/src/airtype-v2.3.0
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-H=windowsgui -s -w -buildid=${AIRTYPE_BUILD_ID}" \
              -o ../../../dist/QAA-AirType-Official-Tray-v2.3.0.exe .
          )

          (
            cd work/src/adb-tap-wireless-v1.1.0
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -ldflags '-s -w -H=windowsgui' \
              -o ../../../dist/QAA-ADB-Tap-v1.1.0.exe .
          )

          (
            cd work/src/adb-tap-direct-v1.2.0
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -ldflags '-s -w -H=windowsgui' \
              -o ../../../dist/QAA-ADB-Tap-v1.2.0-DirectADB.exe .
          )

      - name: Verify exact SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'fd685aba6db35ff8e4a24a5056fac2d7a0cfcf7faccaa89e9d2c5afe3ae871f7' 'QAA-ADB-Tap-v1.1.0.exe' \
            '933ac71e5d68b8a6e7d52968c298b758c2cb55bde93611234ce33ea392453cd2' 'QAA-ADB-Tap-v1.2.0-DirectADB.exe' \
            '0326275e8a0abed9d61b4ae713d9c0c84f2eb012632832f0bd72de82c2454cbc' 'QAA-AirType-Official-Tray-v2.3.0.exe' \
            > work/EXE-SHA256SUMS.txt

          (cd dist && sha256sum -c ../work/EXE-SHA256SUMS.txt)
          cp work/EXE-SHA256SUMS.txt dist/EXE-SHA256SUMS.txt

      - name: Build the user-ready all-in-one package
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/使用说明.txt <<'EOF'
          QAA AirType + ADB Toolkit

          1. 手机语音/文字输入到电脑：
             运行 QAA-AirType-Official-Tray-v2.3.0.exe

          2. Android 真机无线调试：
             运行 QAA-ADB-Tap-v1.1.0.exe

          3. 雷电模拟器、USB 真机或其他已出现在 adb devices 中的设备：
             运行 QAA-ADB-Tap-v1.2.0-DirectADB.exe

          本项目不是 QAA-Tools 官方发行版。
          程序目前没有商业代码签名，Windows 可能提示“未知发布者”。
          项目主页：https://github.com/sjlsl6/-
          蓝奏云备用下载：https://wwaug.lanzoub.com/iRb7j3y7gdmb
          EOF

          (
            cd dist
            zip -9 -j ../work/QAA-AirType-ADB-Toolkit-Windows.zip \
              QAA-AirType-Official-Tray-v2.3.0.exe \
              QAA-ADB-Tap-v1.1.0.exe \
              QAA-ADB-Tap-v1.2.0-DirectADB.exe \
              EXE-SHA256SUMS.txt \
              使用说明.txt
          )

          cp work/EXE-SHA256SUMS.txt work/SHA256SUMS.txt
          sha256sum work/QAA-AirType-ADB-Toolkit-Windows.zip \
            | sed 's#work/##' >> work/SHA256SUMS.txt
          cat work/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > work/RELEASE_NOTES.md <<'EOF'
          # QAA AirType + ADB Toolkit

          这是面向 Windows 用户的可直接运行发行版。无需安装 Go，也无需自行编译源码。

          ## 下载哪个文件

          - `QAA-AirType-Official-Tray-v2.3.0.exe`：手机网页/语音输入到 Windows 当前输入框。
          - `QAA-ADB-Tap-v1.1.0.exe`：Android 无线调试版本。
          - `QAA-ADB-Tap-v1.2.0-DirectADB.exe`：雷电模拟器、USB 真机及其他已进入 `adb devices` 的设备。
          - `QAA-AirType-ADB-Toolkit-Windows.zip`：以上三个程序的一体包。
          - `SHA256SUMS.txt`：下载校验值。

          ## 备用下载

          蓝奏云：https://wwaug.lanzoub.com/iRb7j3y7gdmb

          ## 完整性保证

          本发行版由仓库中的三套公开源码使用固定 Go 1.23.2 工具链重新构建。工作流在上传前强制校验三个 EXE 的固定 SHA-256；任一构建结果不一致时，发行流程会失败。

          ## 注意

          - 本仓库是社区修改/扩展项目，不是 QAA-Tools 官方发行版。
          - 历史 AirType 文件名里的 `Official` 不代表官方背书。
          - 三个程序目前没有商业代码签名，Windows SmartScreen 可能提示“未知发布者”。请确认下载来源并核对 SHA-256。
          - AirType 建议仅在可信局域网中使用；ADB 只应连接你拥有或明确获授权控制的设备。
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/QAA-AirType-Official-Tray-v2.3.0.exe
            dist/QAA-ADB-Tap-v1.1.0.exe
            dist/QAA-ADB-Tap-v1.2.0-DirectADB.exe
            work/QAA-AirType-ADB-Toolkit-Windows.zip
            work/SHA256SUMS.txt
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file work/RELEASE_NOTES.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file work/RELEASE_NOTES.md \
              --latest
          fi

      - name: Report successful publication
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Release bot success: ${RELEASE_TAG}" \
            --body "The three exact verified EXEs and the all-in-one ZIP were published successfully. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report publication failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Release bot failure: ${RELEASE_TAG}" \
            --body "The source-rebuild release workflow failed. Inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
