name: Publish verified Windows release

on:
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v2026.07.24
  RELEASE_TITLE: QAA AirType + ADB Toolkit v2026.07.24

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Publish Windows release v2026.07.24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
          check-latest: false

      - name: Extract and test sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src dist
          exec > >(tee -a work/release.log) 2>&1

          unzip -tq src/airtype-v2.3.0-source.zip
          unzip -tq src/adb-tap-wireless-v1.1.0-source.zip
          unzip -tq src/adb-tap-direct-v1.2.0-source.zip
          unzip -q src/airtype-v2.3.0-source.zip -d work/src
          unzip -q src/adb-tap-wireless-v1.1.0-source.zip -d work/src
          unzip -q src/adb-tap-direct-v1.2.0-source.zip -d work/src

          AIRTYPE_DIR="$(dirname "$(find work/src -path '*/airtype-v2.3.0/go.mod' -print -quit)")"
          WIRELESS_DIR="$(dirname "$(find work/src -path '*/adb-tap-wireless-v1.1.0/go.mod' -print -quit)")"
          DIRECT_DIR="$(dirname "$(find work/src -path '*/adb-tap-direct-v1.2.0/go.mod' -print -quit)")"
          test -n "$AIRTYPE_DIR"
          test -n "$WIRELESS_DIR"
          test -n "$DIRECT_DIR"
          printf '%s\n' "$AIRTYPE_DIR" "$WIRELESS_DIR" "$DIRECT_DIR" > work/source-directories.txt

          (cd "$AIRTYPE_DIR" && go test ./...)
          (cd "$WIRELESS_DIR" && go test ./...)
          (cd "$DIRECT_DIR" && go test ./...)

      - name: Build and verify exact executables
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a work/release.log) 2>&1
          ROOT="$PWD"
          DIST="$ROOT/dist"
          mapfile -t DIRS < work/source-directories.txt
          AIRTYPE_DIR="${DIRS[0]}"
          WIRELESS_DIR="${DIRS[1]}"
          DIRECT_DIR="${DIRS[2]}"
          AIRTYPE_BUILD_ID='N1kGQiO1P6MzOKbcXgXd/skKJPixqLtyG3qtgIffH/_rsAK9qPrzbXJoXR7YLR/TWbXoBLMtW9ip9oHsDoQ'

          (cd "$AIRTYPE_DIR" && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H=windowsgui -s -w -buildid=${AIRTYPE_BUILD_ID}" -o "$DIST/QAA-AirType-Official-Tray-v2.3.0.exe" .)
          (cd "$WIRELESS_DIR" && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -H=windowsgui' -o "$DIST/QAA-ADB-Tap-v1.1.0.exe" .)
          (cd "$DIRECT_DIR" && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -H=windowsgui' -o "$DIST/QAA-ADB-Tap-v1.2.0-DirectADB.exe" .)

          printf '%s  %s\n' \
            'fd685aba6db35ff8e4a24a5056fac2d7a0cfcf7faccaa89e9d2c5afe3ae871f7' 'QAA-ADB-Tap-v1.1.0.exe' \
            '933ac71e5d68b8a6e7d52968c298b758c2cb55bde93611234ce33ea392453cd2' 'QAA-ADB-Tap-v1.2.0-DirectADB.exe' \
            '0326275e8a0abed9d61b4ae713d9c0c84f2eb012632832f0bd72de82c2454cbc' 'QAA-AirType-Official-Tray-v2.3.0.exe' \
            > work/EXE-SHA256SUMS.txt
          (cd dist && sha256sum -c ../work/EXE-SHA256SUMS.txt)
          cp work/EXE-SHA256SUMS.txt dist/EXE-SHA256SUMS.txt

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a work/release.log) 2>&1

          printf '%s\n' \
            'QAA AirType + ADB Toolkit' \
            '' \
            '手机语音/文字输入到电脑：QAA-AirType-Official-Tray-v2.3.0.exe' \
            'Android 真机无线调试：QAA-ADB-Tap-v1.1.0.exe' \
            '雷电模拟器、USB 真机或其他在线 ADB 设备：QAA-ADB-Tap-v1.2.0-DirectADB.exe' \
            '' \
            'GitHub：https://github.com/sjlsl6/-' \
            '蓝奏云备用：https://wwaug.lanzoub.com/iRb7j3y7gdmb' \
            '本项目不是 QAA-Tools 官方发行版。' \
            > dist/使用说明.txt

          (cd dist && zip -9 -j ../work/QAA-AirType-ADB-Toolkit-Windows.zip QAA-AirType-Official-Tray-v2.3.0.exe QAA-ADB-Tap-v1.1.0.exe QAA-ADB-Tap-v1.2.0-DirectADB.exe EXE-SHA256SUMS.txt 使用说明.txt)
          cp work/EXE-SHA256SUMS.txt work/SHA256SUMS.txt
          sha256sum work/QAA-AirType-ADB-Toolkit-Windows.zip | sed 's#work/##' >> work/SHA256SUMS.txt

          printf '%s\n' \
            '# QAA AirType + ADB Toolkit' \
            '' \
            'Windows 可直接运行版，无需安装 Go。' \
            '' \
            '- `QAA-AirType-Official-Tray-v2.3.0.exe`：手机语音/文字输入到电脑。' \
            '- `QAA-ADB-Tap-v1.1.0.exe`：无线 ADB 版本。' \
            '- `QAA-ADB-Tap-v1.2.0-DirectADB.exe`：雷电模拟器、USB 真机等现有 ADB 设备。' \
            '- `QAA-AirType-ADB-Toolkit-Windows.zip`：三合一下载包。' \
            '- `SHA256SUMS.txt`：校验文件。' \
            '' \
            '蓝奏云备用下载：https://wwaug.lanzoub.com/iRb7j3y7gdmb' \
            '' \
            '三个 EXE 均由公开源码使用 Go 1.23.2 重建，并在发布前核对固定 SHA-256；只有与已验证可用版本逐字节一致才会发布。' \
            '' \
            '本项目不是 QAA-Tools 官方发行版。程序没有商业代码签名，Windows 可能显示“未知发布者”。' \
            > work/RELEASE_NOTES.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a work/release.log) 2>&1
          assets=(
            dist/QAA-AirType-Official-Tray-v2.3.0.exe
            dist/QAA-ADB-Tap-v1.1.0.exe
            dist/QAA-ADB-Tap-v1.2.0-DirectADB.exe
            work/QAA-AirType-ADB-Toolkit-Windows.zip
            work/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file work/RELEASE_NOTES.md --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file work/RELEASE_NOTES.md --latest
          fi

      - name: Report success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Release bot success final: ${RELEASE_TAG}" \
            --body "All five Release assets were published after exact EXE hash verification. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo 'Verified release workflow failed.'; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo; echo '```text'; tail -c 14000 work/release.log 2>/dev/null || true; echo '```'; } > /tmp/failure.md
          gh issue create --title "Release bot failure final: ${RELEASE_TAG}" --body-file /tmp/failure.md
