# Temporary generic JDK export trigger.
name: Export Generic JDK 17

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-generic-jdk17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-jdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Package dereferenced JDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JDK_PARENT="$(dirname "$JAVA_HOME")"
          JDK_NAME="$(basename "$JAVA_HOME")"
          tar -chzf out/temurin-jdk17-linux-x64.tar.gz -C "$JDK_PARENT" "$JDK_NAME"
          printf '%s\n' 'Generic Temurin JDK 17 only; no project files are included.' > out/README.txt
          (cd out && sha256sum temurin-jdk17-linux-x64.tar.gz > SHA256SUMS.txt)
          tar -tzf out/temurin-jdk17-linux-x64.tar.gz > out/JDK_CONTENTS.txt
          grep -m1 '/bin/javac$' out/JDK_CONTENTS.txt

      - name: Upload generic JDK
        uses: actions/upload-artifact@v4
        with:
          name: generic-temurin-jdk17-linux-x64
          path: out/*
          if-no-files-found: error
          retention-days: 1
